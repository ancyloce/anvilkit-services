# The qualification environment's pinned combination (P23-04): every component,
# its sync wave, chart and values. deploy/gitops/publish.py resolves it against a
# release manifest (tools/release-artifacts.py) into the values of the
# anvilkit-environment chart: upstream charts are mirrored into the environment's
# registry at these exact versions, the parent's platform charts and the
# environment chart are published with a per-run version, the service charts and
# images come from the release manifest by version and digest. Nothing here is a
# production value: production needs ENV-01..10 (deploy/gitops/lock.yaml).
#
# Fields per application:
#   wave, layer, namespace     ordering (platform < stateful < migrations < apps < probes)
#   chart.upstream/version     a third-party chart mirrored by version (path platform)
#   chart.source               a parent-owned chart (deploy/qualification/platform/<name>)
#   chart.release              a service chart of the release manifest
#   valuesFile                 a parent environment values file packaged with the chart
#   values                     inline values
#   imageDigests               values path -> release image whose digest it takes
#   imageRefs                  values path -> release image whose full reference it takes
#   releaseFiles               values path -> a file of the release (its contents)
#   environmentRevision        values path -> the environment chart version being published
environment: qualification
registry: anvilkit-dev-registry:5000
argocdNamespace: anvilkit-platform
project: anvilkit
applications:
  # --- platform dependencies -------------------------------------------------
  - name: cert-manager
    wave: -50
    layer: platform
    namespace: cert-manager
    chart: {upstream: oci://quay.io/jetstack/charts/cert-manager, name: cert-manager, version: v1.21.2}
    values:
      crds: {enabled: true}
  # P0.1: the workload PKI (SelfSigned bootstrap -> root CA -> ClusterIssuer
  # anvilkit-qualification-ca) every service chart's identity Certificate
  # references; DEVELOPMENT_ONLY trust material until ENV-03.
  - name: anvilkit-pki
    wave: -48
    layer: platform
    namespace: cert-manager
    chart: {source: deploy/qualification/platform/pki, name: anvilkit-pki}
  - name: metrics-server
    wave: -50
    layer: platform
    namespace: kube-system
    chart: {upstream: https://kubernetes-sigs.github.io/metrics-server, name: metrics-server, version: 3.14.0}
    values:
      args: [--kubelet-insecure-tls]
  - name: kyverno
    wave: -50
    layer: platform
    namespace: kyverno
    chart: {upstream: https://kyverno.github.io/kyverno, name: kyverno, version: 3.9.1}
    # The chart renders its CRDs with empty annotations/labels maps, which a
    # server-side apply drops: without this the CRDs read OutOfSync forever.
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jsonPointers: [/metadata/annotations, /metadata/labels]
    syncOptions: [ServerSideApply=true, RespectIgnoreDifferences=true]
    values:
      # P0.5: three admission replicas behind a PDB, so losing one never stops
      # the Job-boundary admission (failurePolicy Fail).
      admissionController: {replicas: 3, podDisruptionBudget: {enabled: true, minAvailable: 2}}
      backgroundController: {replicas: 1}
      cleanupController: {replicas: 1}
      reportsController: {replicas: 1}
  - name: cloudnative-pg
    wave: -50
    layer: platform
    namespace: cnpg-system
    chart: {upstream: https://cloudnative-pg.github.io/charts, name: cloudnative-pg, version: 0.29.1}
    syncOptions: [ServerSideApply=true]
  - name: plugin-barman-cloud
    wave: -45
    layer: platform
    namespace: cnpg-system
    chart: {upstream: https://cloudnative-pg.github.io/charts, name: plugin-barman-cloud, version: 0.8.1}
  - name: anvilkit-admission
    wave: -45
    layer: platform
    namespace: kyverno
    chart: {source: deploy/qualification/platform/admission, name: anvilkit-admission}
    releaseFiles:
      publicKey: cosign.pub
  # P0.5: the Job-boundary admission (deploy/policies/chart): the components and
  # parser template/digest policies, this environment's registry allowlist and
  # the DaemonSet that places the candidate seccomp profile on every node.
  # bootstrap.py runs deploy/policies/check.sh --cluster after the sync.
  - name: anvilkit-job-admission
    wave: -44
    layer: platform
    namespace: kyverno
    chart: {source: deploy/policies/chart, name: anvilkit-job-admission}
    values:
      registries:
        components: ["anvilkit-dev-registry:5000/", "docker.io/library/busybox@"]
        parsing: ["anvilkit-dev-registry:5000/"]
  # P0.4: default deny in the six AnvilKit namespaces with one allow rule per
  # row of the communication matrix (deploy/qualification/platform/network;
  # check-network.py). kindnet does not enforce NetworkPolicy, so on this
  # cluster the policies are the production shape, not a control; Cilium is
  # the enforcing CNI of the target platform. The externals are this
  # cluster's kind network (DEVELOPMENT_ONLY): the API server and kubelets of
  # its nodes and the DR store container; ENV-03 supplies the environment's.
  - name: anvilkit-network
    wave: -45
    layer: platform
    namespace: anvilkit-platform
    chart: {source: deploy/qualification/platform/network, name: anvilkit-network}
    values:
      externals:
        kubernetesAPI: {cidrs: ["172.22.0.0/16"], ports: [6443]}
        nodes: {cidrs: ["172.22.0.0/16"], ports: []}
        backups: {cidrs: ["172.22.0.0/16"], ports: [9000]}
        inventory: {cidrs: ["172.22.0.0/16"], ports: [9000]}
  # The redacted telemetry pipeline (P23-06): one Collector per worker node. It
  # reads the anvilkit-* container logs, scrapes the services' metrics ports and
  # receives their spans over OTLP; spans keep the allowlisted attributes only
  # (security.md), log bodies lose secret shapes, and every signal is written to
  # /var/lib/anvilkit-telemetry on the node for check-telemetry.py. No Prometheus,
  # Loki or Tempo backend: those are ENV-01/05 production inputs.
  - name: anvilkit-telemetry
    wave: -45
    layer: platform
    namespace: anvilkit-observability
    chart: {upstream: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-collector, version: 0.174.1}
    values:
      mode: daemonset
      fullnameOverride: anvilkit-otel-collector
      # The services' OTLP endpoint; in daemonset mode the chart creates it only when
      # asked, with internalTrafficPolicy Local (each Pod reaches its node's Collector).
      service: {enabled: true}
      image:
        repository: otel/opentelemetry-collector-contrib
        tag: "0.161.0"
        digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
      command: {name: otelcol-contrib}
      nodeSelector: {anvilkit.io/pool: components}
      # Root reads the kubelet's 0640 pod logs and writes the node directory; no
      # capability, read-only root file system.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {memory: 384Mi}
      clusterRole:
        create: true
        rules:
          - {apiGroups: [""], resources: [pods], verbs: [get, list, watch]}
      ports:
        jaeger-compact: {enabled: false}
        jaeger-thrift: {enabled: false}
        jaeger-grpc: {enabled: false}
        zipkin: {enabled: false}
      extraVolumes:
        - {name: podlogs, hostPath: {path: /var/log/pods, type: Directory}}
        - {name: telemetry, hostPath: {path: /var/lib/anvilkit-telemetry, type: DirectoryOrCreate}}
      extraVolumeMounts:
        - {name: podlogs, mountPath: /var/log/pods, readOnly: true}
        - {name: telemetry, mountPath: /var/lib/anvilkit-telemetry}
      alternateConfig:
        extensions:
          health_check: {endpoint: "${env:MY_POD_IP}:13133"}
        receivers:
          otlp:
            protocols:
              grpc: {endpoint: "${env:MY_POD_IP}:4317"}
              http: {endpoint: "${env:MY_POD_IP}:4318"}
          filelog:
            include:
              - /var/log/pods/anvilkit-apps_*/*/*.log
              - /var/log/pods/anvilkit-components_*/*/*.log
              - /var/log/pods/anvilkit-data_*/*/*.log
              - /var/log/pods/anvilkit-platform_*/*/*.log
            start_at: beginning
            include_file_path: true  # the container parser takes the pod, namespace and container from it
            operators:
              - {type: container, id: container-parser}
          prometheus:
            config:
              scrape_configs:
                - job_name: anvilkit
                  scrape_interval: 15s
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces: {names: [anvilkit-apps]}
                      selectors: [{role: pod, field: "spec.nodeName=${env:OTEL_K8S_NODE_NAME}"}]
                  relabel_configs:
                    - {source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true"}
                    - {source_labels: [__meta_kubernetes_pod_container_port_name], action: keep, regex: "metrics|health"}
                    - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name], target_label: job}
                    - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
        processors:
          memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
          batch: {}
          # Spans keep the attributes the services promise and nothing else; a value
          # with a secret shape is masked even under an allowed key.
          redaction:
            allow_all_keys: false
            allowed_keys:
              - service.name
              - http.request.method
              - http.route
              - http.response.status_code
              - rpc.system
              - rpc.system.name
              - rpc.service
              - rpc.method
              - rpc.grpc.status_code
              - rpc.response.status_code
              - messaging.system
              - messaging.destination.name
              - anvilkit.delivery.outcome
              - temporalWorkflowID
              - temporalRunID
              - temporalActivityID
              - temporalUpdateID
            blocked_values:
              - "(?i)bearer\\s+[A-Za-z0-9._~+/-]{20,}"
              - "[a-z][a-z0-9+.-]*://[^\\s:/@]+:[^\\s@/]+@"
              - "(?i)x-amz-signature=[0-9a-f]{16,}"
              - "\\bAKIA[0-9A-Z]{16}\\b"
              - "\\bsk-[A-Za-z0-9]{20,}"
            summary: debug
          # Log bodies are what the containers wrote: the services never log a secret
          # (check-telemetry.py reads the raw logs too); this masks the shapes anyway.
          transform/logs:
            error_mode: ignore
            log_statements:
              - context: log
                statements:
                  - 'replace_pattern(body, "(?i)bearer\\s+[A-Za-z0-9._~+/-]{20,}", "Bearer [REDACTED]")'
                  - 'replace_pattern(body, "([a-z][a-z0-9+.-]*://)[^\\s:/@\"'']+:[^\\s@/\"'']+@", "$$1[REDACTED]@")'
                  - 'replace_pattern(body, "(?i)(x-amz-signature=)[0-9a-f]{16,}", "$$1[REDACTED]")'
                  - 'replace_pattern(body, "-----BEGIN [A-Z ]*PRIVATE KEY-----[^-]*-----END [A-Z ]*PRIVATE KEY-----", "[REDACTED PRIVATE KEY]")'
                  - 'replace_pattern(body, "\\bAKIA[0-9A-Z]{16}\\b", "[REDACTED]")'
                  - 'replace_pattern(body, "\\bsk-[A-Za-z0-9]{20,}", "[REDACTED]")'
        exporters:
          file/traces: {path: /var/lib/anvilkit-telemetry/traces.jsonl, format: json, rotation: {max_megabytes: 64, max_backups: 2}}
          file/metrics: {path: /var/lib/anvilkit-telemetry/metrics.jsonl, format: json, rotation: {max_megabytes: 64, max_backups: 2}}
          file/logs: {path: /var/lib/anvilkit-telemetry/logs.jsonl, format: json, rotation: {max_megabytes: 64, max_backups: 2}}
        service:
          extensions: [health_check]
          telemetry:
            metrics:
              readers:
                - pull: {exporter: {prometheus: {host: "${env:MY_POD_IP}", port: 8888}}}
          pipelines:
            traces: {receivers: [otlp], processors: [memory_limiter, redaction, batch], exporters: [file/traces]}
            metrics: {receivers: [prometheus], processors: [memory_limiter, batch], exporters: [file/metrics]}
            logs: {receivers: [filelog], processors: [memory_limiter, transform/logs, batch], exporters: [file/logs]}
  # P0.6: the Secrets Store CSI driver (the OpenBao provider is the openbao chart's
  # DaemonSet). Secret sync only for the classes that declare secretObjects
  # (anvilkit-secrets); rotation polls every 2 minutes; the Pods' ServiceAccount
  # tokens of audience openbao are passed to the provider (OpenBao's Kubernetes auth).
  - name: secrets-store-csi-driver
    wave: -40
    layer: platform
    namespace: kube-system
    chart: {upstream: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts, name: secrets-store-csi-driver, version: 1.6.1}
    values:
      syncSecret: {enabled: true}
      enableSecretRotation: true
      rotationPollInterval: 2m
      tokenRequests:
        - {audience: openbao, expirationSeconds: 600}
      linux:
        image: {digest: "sha256:b48d7d13dd06f0c7fdb2ec03683387e229d80d327172ecb0e21948b811540c6e"}
        registrarImage: {digest: "sha256:ab482308a4921e28a6df09a16ab99a457e9af9641ff44fb1be1a690d07ce8b70"}
        livenessProbeImage: {digest: "sha256:c4cc074199c045dd73ab85f28897e2a32f4d6f38ffdba4f3b13b8007ccbd3570"}
        crds:
          image: {tag: "v1.6.1@sha256:cdacfdbe8966aa77c080b850b52a86880363119530f7aa6b4f05b8ffe19c2ec3"}
  # --- stateful services -----------------------------------------------------
  - name: anvilkit-data
    wave: -30
    layer: stateful
    namespace: anvilkit-data
    chart: {source: deploy/qualification/platform/data, name: anvilkit-data}
  - name: anvilkit-objects
    wave: -30
    layer: stateful
    namespace: anvilkit-data
    chart: {source: deploy/qualification/platform/objects, name: anvilkit-objects}
  - name: anvilkit-nats
    wave: -30
    layer: stateful
    namespace: anvilkit-data
    chart: {upstream: https://nats-io.github.io/k8s/helm/charts, name: nats, version: 2.12.4}
    # P0.6: client and route TLS with the cert-manager server certificate
    # (anvilkit-pki servers, routes verify each other against the CA) and the
    # NKey users with per-role subject permissions: the ConfigMap
    # anvilkit-nats-auth that deploy/qualification/bootstrap.py renders from
    # the NKeys whose seeds it writes to OpenBao (public keys only); the
    # config reloader re-reads it on rotation.
    values:
      config:
        cluster:
          enabled: true
          replicas: 3
          tls: {enabled: true, secretName: anvilkit-nats-tls, merge: {ca_file: /etc/nats-certs/cluster/ca.crt}}
        nats:
          tls: {enabled: true, secretName: anvilkit-nats-tls}
        jetstream:
          enabled: true
          fileStore: {pvc: {size: 1Gi}}
        merge:
          $include: ../nats-auth/auth.conf
      container:
        image: {tag: "2.12.4-alpine@sha256:31c6ed3b2da61645aaa3ad9217b5a52b34b6ebd555ecb71259cd7723c59ae1ea"}
        patch:
          - {op: add, path: /volumeMounts/-, value: {name: nats-auth, mountPath: /etc/nats-auth, readOnly: true}}
      natsBox: {enabled: false}
      podTemplate:
        topologySpreadConstraints:
          kubernetes.io/hostname: {maxSkew: 1, whenUnsatisfiable: DoNotSchedule}
        patch:
          - {op: add, path: /spec/volumes/-, value: {name: nats-auth, configMap: {name: anvilkit-nats-auth}}}
  - name: anvilkit-valkey-queue
    wave: -30
    layer: stateful
    namespace: anvilkit-data
    # The upstream chart patched (deploy/qualification/platform/valkey/ANVILKIT-PATCH.md) to
    # stop printing the Sentinel configuration (it holds the password) and, P0.6, to pass
    # TLS through its master proxy with TLS-verified health checks. P0.6: the servers,
    # replication and Sentinel speak TLS only with the cert-manager server certificate;
    # the clients connect rediss:// to the master Service and verify it against the CA.
    # The password is the CSI-synced Secret anvilkit-valkey-queue (anvilkit-secrets).
    # Per-service ACL users are NOT in this combination (the chart carries no ACL file
    # next to the replication and Sentinel password): every client authenticates as the
    # default user, a recorded P0.6 gap; the development lane runs one ACL user per role.
    chart: {source: deploy/qualification/platform/valkey, name: valkey}
    values:
      architecture: replication
      replicaCount: 3
      image: {tag: "9.0.2-alpine@sha256:68677f85c863830af7836ff07c4a13b7f085ebeff62f4dedb71499ca27d229f2", imagePullPolicy: IfNotPresent}
      auth: {enabled: true, existingSecret: anvilkit-valkey-queue, existingSecretPasswordKey: password}
      tls: {enabled: true, existingSecret: anvilkit-valkey-queue-tls, certCAFilename: ca.crt, authClients: false}
      config:
        maxMemoryPolicy: noeviction
        save: ""
        extraConfig: ["appendonly yes", "appendfsync everysec"]
      persistence: {size: 1Gi}
      sentinel:
        enabled: true
        quorum: 2
        image: {tag: "9.0.2-alpine@sha256:68677f85c863830af7836ff07c4a13b7f085ebeff62f4dedb71499ca27d229f2", pullPolicy: IfNotPresent}
        # The HAProxy sidecar must not share the pod's TLS port (tls.port 6380).
        masterProxy: {enabled: true, containerPort: 6390}
  - name: anvilkit-qdrant
    wave: -30
    layer: stateful
    namespace: anvilkit-data
    chart: {upstream: https://qdrant.github.io/qdrant-helm, name: qdrant, version: 1.19.0}
    # The chart compares the tag as a semantic version and has no digest field: Qdrant
    # is pinned by tag only here (a recorded limitation). The API key comes from the
    # CSI-synced Secret anvilkit-qdrant-apikey (anvilkit-secrets; the chart's
    # apiKey.valueFrom needs Helm lookup, which Argo CD's rendering cannot do). P0.6: the
    # API and the peer-to-peer channel serve TLS with the cert-manager server certificate.
    values:
      replicaCount: 3
      image: {tag: "v1.19.0"}
      env:
        - {name: QDRANT__SERVICE__API_KEY, valueFrom: {secretKeyRef: {name: anvilkit-qdrant-apikey, key: apiKey}}}
      persistence: {size: 2Gi}
      snapshotPersistence: {enabled: true, size: 2Gi}
      additionalVolumes:
        - name: tls
          secret: {secretName: anvilkit-qdrant-tls}
      additionalVolumeMounts:
        - {name: tls, mountPath: /qdrant/tls, readOnly: true}
      config:
        cluster:
          enabled: true
          p2p: {enable_tls: true}
        service: {enable_tls: true}
        tls:
          cert: /qdrant/tls/tls.crt
          key: /qdrant/tls/tls.key
          ca_cert: /qdrant/tls/ca.crt
          cert_ttl: 3600
  - name: openbao
    wave: -30
    layer: stateful
    namespace: anvilkit-platform
    chart: {upstream: https://openbao.github.io/openbao-helm, name: openbao, version: 0.29.5}
    # P0.6: the listener and the raft joins serve TLS with the cert-manager server
    # certificate openbao-tls (joins verify it against the CA); the CSI provider
    # (DaemonSet, agent off) mounts only that CA. Kubernetes auth, the per-service
    # roles and policies and the KV v2 credentials are bootstrap.py's; the root token
    # is revoked after it, and the unseal shares never leave the custody location.
    values:
      global: {tlsDisable: false}
      injector: {enabled: false}
      csi:
        enabled: true
        image: {tag: "2.0.3@sha256:ad30d5f6223f30f62e8df6e444b84af5b05402a70c09712415dd1d7f139c027e"}
        agent: {enabled: false}
        volumes:
          - name: openbao-ca
            secret: {secretName: openbao-tls, items: [{key: ca.crt, path: ca.crt}]}
        volumeMounts:
          - {name: openbao-ca, mountPath: /openbao/tls, readOnly: true}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 128Mi}
      ui: {enabled: false}
      server:
        dataStorage: {size: 1Gi}
        extraEnvironmentVars:
          BAO_CACERT: /openbao/tls/ca.crt
        volumes:
          - name: openbao-tls
            secret: {secretName: openbao-tls}
        volumeMounts:
          - {name: openbao-tls, mountPath: /openbao/tls, readOnly: true}
        ha:
          enabled: true
          replicas: 3
          raft:
            enabled: true
            setNodeId: true
            config: |
              ui = false
              listener "tcp" {
                address = "[::]:8200"
                cluster_address = "[::]:8201"
                tls_cert_file = "/openbao/tls/tls.crt"
                tls_key_file = "/openbao/tls/tls.key"
                tls_min_version = "tls12"
                # The shares' break-glass: a root token is generated only with the custody
                # threshold of unseal shares (bao 2.6 refuses the unauthenticated endpoint by default).
                disable_unauthed_generate_root_endpoints = false
              }
              storage "raft" {
                path = "/openbao/data"
                retry_join {
                  leader_api_addr = "https://openbao-0.openbao-internal:8200"
                  leader_ca_cert_file = "/openbao/tls/ca.crt"
                }
                retry_join {
                  leader_api_addr = "https://openbao-1.openbao-internal:8200"
                  leader_ca_cert_file = "/openbao/tls/ca.crt"
                }
                retry_join {
                  leader_api_addr = "https://openbao-2.openbao-internal:8200"
                  leader_ca_cert_file = "/openbao/tls/ca.crt"
                }
              }
              service_registration "kubernetes" {}
  # P0.6: the Kubernetes Secrets the third-party charts read, synced from OpenBao by the
  # CSI driver (no Secret with credential material is created by hand).
  - name: anvilkit-secrets
    wave: -29
    layer: stateful
    namespace: anvilkit-platform
    chart: {source: deploy/qualification/platform/secrets, name: anvilkit-secrets}
    values:
      syncs:
        - name: anvilkit-secrets-data
          namespace: anvilkit-data
          path: kv/data/anvilkit/sync/data
          secrets:
            - {name: anvilkit-dr-backup, data: {ACCESS_KEY_ID: dr-backup-access-key-id, ACCESS_SECRET_KEY: dr-backup-secret-access-key}}
            - {name: anvilkit-valkey-queue, data: {password: valkey-password}}
            - {name: anvilkit-qdrant-apikey, data: {apiKey: qdrant-api-key}}
            - {name: anvilkit-objects-root, data: {MINIO_ROOT_USER: objects-root-user, MINIO_ROOT_PASSWORD: objects-root-password}}
            - name: anvilkit-objects-users
              data:
                ARTIFACTS_ACCESS_KEY_ID: objects-artifacts-access-key-id
                ARTIFACTS_SECRET_ACCESS_KEY: objects-artifacts-secret-access-key
                MODEL_PROXY_ACCESS_KEY_ID: objects-model-proxy-access-key-id
                MODEL_PROXY_SECRET_ACCESS_KEY: objects-model-proxy-secret-access-key
                KNOWLEDGE_ACCESS_KEY_ID: objects-knowledge-access-key-id
                KNOWLEDGE_SECRET_ACCESS_KEY: objects-knowledge-secret-access-key
        - name: anvilkit-secrets-platform
          namespace: anvilkit-platform
          path: kv/data/anvilkit/sync/platform
          secrets:
            - {name: anvilkit-temporal-db, data: {password: temporal-db-password}}
            - {name: anvilkit-probe-token, data: {token: probe-token}}
        - name: anvilkit-secrets-apps
          namespace: anvilkit-apps
          path: kv/data/anvilkit/sync/apps
          secrets:
            # DEVELOPMENT_ONLY: the API's fixture principals (no IdP in qualification, ENV-07).
            - {name: anvilkit-agent-api-principals, data: {principals.json: api-principals}}
            # DEVELOPMENT_ONLY: the Model Proxy's bearer principals (its listener's mtls mode
            # with the SPIFFE mapping is the next step; F-P0.1-1 landed in the service).
            - {name: anvilkit-agent-model-proxy-principals, data: {principals.json: model-proxy-principals}}
  # --- platform services ------------------------------------------------------
  - name: anvilkit-temporal
    wave: -20
    layer: stateful
    namespace: anvilkit-platform
    chart: {upstream: https://go.temporal.io/helm-charts, name: temporal, version: 1.6.0}
    # P0.6: the frontend serves TLS with the cert-manager server certificate (the
    # services' temporal.tls.mode tls verifies it by serverName), the internal clients
    # and the namespace Job verify it, and the persistence connects to the CNPG
    # cluster with verify-full TLS; the database password is the CSI-synced
    # anvilkit-temporal-db Secret (anvilkit-secrets).
    values:
      server:
        frontend: {replicaCount: 2}
        history: {replicaCount: 3}
        matching: {replicaCount: 2}
        worker: {replicaCount: 2}
        additionalVolumes:
          - name: frontend-tls
            secret: {secretName: anvilkit-temporal-frontend-tls}
        additionalVolumeMounts:
          - {name: frontend-tls, mountPath: /etc/temporal/tls/frontend, readOnly: true}
        config:
          tls:
            frontend:
              server:
                certFile: /etc/temporal/tls/frontend/tls.crt
                keyFile: /etc/temporal/tls/frontend/tls.key
                requireClientAuth: false
              client:
                serverName: anvilkit-temporal-frontend
                rootCaFiles: [/etc/temporal/tls/frontend/ca.crt]
          namespaces:
            create: true
            namespace: [{name: anvilkit, retention: 3d}]
          persistence:
            numHistoryShards: 128
            datastores:
              default:
                sql:
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal
                  connectAddr: anvilkit-temporal-rw.anvilkit-data.svc.cluster.local:5432
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: anvilkit-temporal-db
                  secretKey: password
                  createDatabase: false
                  manageSchema: true
                  maxConns: 20
                  maxIdleConns: 5
                  tls: {enabled: true, caFile: /etc/temporal/tls/frontend/ca.crt, enableHostVerification: true, serverName: anvilkit-temporal-rw.anvilkit-data.svc.cluster.local}
              visibility:
                sql:
                  pluginName: postgres12
                  driverName: postgres12
                  databaseName: temporal_visibility
                  connectAddr: anvilkit-temporal-rw.anvilkit-data.svc.cluster.local:5432
                  connectProtocol: tcp
                  user: temporal
                  existingSecret: anvilkit-temporal-db
                  secretKey: password
                  createDatabase: false
                  manageSchema: true
                  maxConns: 10
                  maxIdleConns: 2
                  tls: {enabled: true, caFile: /etc/temporal/tls/frontend/ca.crt, enableHostVerification: true, serverName: anvilkit-temporal-rw.anvilkit-data.svc.cluster.local}
      admintools:
        additionalVolumes:
          - name: frontend-tls
            secret: {secretName: anvilkit-temporal-frontend-tls, items: [{key: ca.crt, path: ca.crt}]}
        additionalVolumeMounts:
          - {name: frontend-tls, mountPath: /etc/temporal/tls/frontend, readOnly: true}
        additionalEnv:
          - {name: TEMPORAL_TLS_CA, value: /etc/temporal/tls/frontend/ca.crt}
          - {name: TEMPORAL_TLS_SERVER_NAME, value: anvilkit-temporal-frontend}
      web: {enabled: false}
  - name: anvilkit-streams
    wave: -20
