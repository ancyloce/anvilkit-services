{{- if not .Values.environment }}{{ fail "environment is required" }}{{ end }}
# One project for the environment: sources only from the environment's registry,
# destinations only the namespaces the combination's applications name (each one's
# own and those it declares it writes into, destinationNamespaces; and Argo
# CD's own), in the cluster this Argo CD runs in. Cluster-scoped resources are
# limited to the kinds the combination declares (clusterResources: the platform
# charts' CRDs, webhooks, ClusterRoles, policies, issuers); outside a development
# combination the list is required (P3.2: scoped per namespace and kind).
{{- $namespaces := list .Values.argocdNamespace }}
{{- range .Values.applications }}
{{- $namespaces = append $namespaces .namespace }}
{{- range (.destinationNamespaces | default list) }}
{{- $namespaces = append $namespaces . }}
{{- end }}
{{- end }}
{{- if and (not .Values.clusterResources) (not .Values.development) }}
{{- fail "clusterResources is required outside a development combination: the cluster-scoped kinds the platform charts create" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project }}
  namespace: {{ .Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
  description: {{ printf "AnvilKit %s environment" .Values.environment | quote }}
  sourceRepos:
    - {{ printf "%s/*" .Values.registry | quote }}
  destinations:
    {{- range ($namespaces | uniq | sortAlpha) }}
    - server: https://kubernetes.default.svc
      namespace: {{ . | quote }}
    {{- end }}
  clusterResourceWhitelist:
    {{- if .Values.clusterResources }}
    {{- toYaml .Values.clusterResources | nindent 4 }}
    {{- else }}
    - group: "*"
      kind: "*"
    {{- end }}
