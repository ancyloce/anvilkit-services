# Pod-level network isolation of the Job namespace (DD-10 §2): default deny
# in both directions for every Pod of anvilkit-components. The environment
# adds the egress policy that admits the sidecar's upstreams (Control, the
# Model Proxy, Knowledge, MCP and the object store) by address and port
# (deploy/qualification/platform/network, deploy/compose/jobs/cluster.yaml);
# the development foundation (deploy/dev/up.sh) adds none, and its kindnet
# does not enforce NetworkPolicy. A Pod NetworkPolicy isolates Pods, not the
# two containers of one Pod: the candidate container is kept off the network
# by its syscall profile (deploy/policies/seccomp) and, on the target
# runtime, by gVisor; this file alone proves nothing about same-Pod egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anvilkit-components-default-deny
  namespace: anvilkit-components
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
