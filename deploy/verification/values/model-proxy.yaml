replicaCount: 1
image:
  repository: 10.203.0.12:30500/anvilkit-agent-model-proxy
  digest: sha256:8d7a13c440816518a386da311f5f72d4383bd3713fb55c089b93d07e40dbaa18
  pullPolicy: IfNotPresent
podDisruptionBudget:
  enabled: false
podLabels:
  anvilkit.io/owner: repairs-f01-f12
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: '1'
    memory: 512Mi
control:
  address: anvilkit-agent-control:9101
identity:
  principalsSecret:
    name: proxy-principals
store:
  s3:
    endpoint: http://minio:9000
    bucket: anvilkit-model-proxy
    secret:
      name: proxy-store
credentialCSI:
  secretProviderClass: model-proxy-deepseek
  files:
  - env: ANVILKIT_MODEL_PROXY_CREDENTIAL_DEEPSEEK
    name: deepseek-api-key
config:
  routes:
  - id: deepseek-verification
    enabled: true
    api: openai-completions
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com
    credential_env: ANVILKIT_MODEL_PROXY_CREDENTIAL_DEEPSEEK
    limits:
      max_output_tokens: 2048
      max_exposure:
        currency: USD
        amount: '200000'
      max_deadline: 5m
      max_frame_bytes: 65536
      max_output_bytes: 1048576
      max_frames: 4096
      upstream_timeout: 3m
      max_evidence_bytes: 4194304
    tools:
    - name: submit_requirements
      description: Submits the structured requirements of the requested component.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - componentName
        - packageName
        - purpose
        - content
        - interaction
        - editableFields
        - constraints
        - acceptance
        - unknowns
        properties:
          componentName:
            type: string
            pattern: ^[A-Z][A-Za-z0-9]{0,63}$
          packageName:
            type: string
            pattern: ^(@[a-z0-9-]+/)?[a-z0-9][a-z0-9._-]{0,212}$
          purpose:
            type: string
            minLength: 1
            maxLength: 2000
          content:
            type: string
            minLength: 1
            maxLength: 8000
          interaction:
            type: string
            maxLength: 4000
          editableFields:
            type: array
            maxItems: 32
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - type
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                type:
                  type: string
                  enum:
                  - text
                  - richtext
                  - image
                  - link
                  - number
                  - boolean
                  - color
                default:
                  type: string
                  maxLength: 2000
          constraints:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 1000
          acceptance:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 1000
          unknowns:
            type: array
            maxItems: 16
            items:
              type: string
              maxLength: 1000
    - name: ask_questions
      description: Asks at most three grouped clarification questions when the request
        is insufficient.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - questions
        properties:
          questions:
            type: array
            minItems: 1
            maxItems: 3
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - text
              properties:
                id:
                  type: string
                  pattern: ^q[1-9]$
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
