apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  labels: &id001
    app: verification-temporal
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verification-temporal
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        anvilkit.io/workload: data
      containers:
      - name: temporal
        image: {{ .Values.temporal | quote }}
        ports:
        - name: service
          containerPort: 7233
        readinessProbe:
          tcpSocket:
            port: service
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - temporal
        - server
        - start-dev
        - --ip
        - 0.0.0.0
        - --port
        - '7233'
        - --namespace
        - anvilkit
        - --db-filename
        - /data/temporal.db
      volumes:
      - name: data
        hostPath:
          path: /var/lib/anvilkit-verification/temporal
          type: DirectoryOrCreate
      securityContext:
        runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  labels:
    app: verification-temporal
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  selector:
    app: verification-temporal
  ports:
  - name: service
    port: 7233
    targetPort: service
