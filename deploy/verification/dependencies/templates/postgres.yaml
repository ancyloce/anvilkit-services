apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: &id001
    app: verification-postgres
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verification-postgres
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        anvilkit.io/workload: data
      containers:
      - name: postgres
        image: {{ .Values.postgres | quote }}
        ports:
        - name: service
          containerPort: 5432
        readinessProbe:
          tcpSocket:
            port: service
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        envFrom:
        - secretRef:
            name: postgres-credentials
      volumes:
      - name: data
        hostPath:
          path: /var/lib/anvilkit-verification/postgres
          type: DirectoryOrCreate
      - name: init
        configMap:
          name: postgres-init
          defaultMode: 365
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: verification-postgres
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  selector:
    app: verification-postgres
  ports:
  - name: service
    port: 5432
    targetPort: service
