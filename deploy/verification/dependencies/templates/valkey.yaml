apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: &id001
    app: verification-valkey
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: verification-valkey
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        anvilkit.io/workload: data
      containers:
      - name: valkey
        image: {{ .Values.valkey | quote }}
        ports:
        - name: service
          containerPort: 6379
        readinessProbe:
          tcpSocket:
            port: service
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /data
        command:
        - valkey-server
        - --appendonly
        - 'yes'
        - --dir
        - /data
      volumes:
      - name: data
        hostPath:
          path: /var/lib/anvilkit-verification/valkey
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  labels:
    app: verification-valkey
    anvilkit.io/owner: repairs-f01-f12
    anvilkit.io/class: platform
spec:
  selector:
    app: verification-valkey
  ports:
  - name: service
    port: 6379
    targetPort: service
