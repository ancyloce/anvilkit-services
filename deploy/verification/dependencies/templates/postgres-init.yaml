apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  10-anvilkit.sh: "#!/bin/sh\n# Runs once on an empty data directory. Creates the\
    \ owned databases with their\n# separate app/migrator roles (architecture.md naming)\
    \ and Temporal's stores.\n# ANVILKIT_DEV_PASSWORD is generated by up.sh into .local/dev/postgres.env.\n\
    set -eu\npsql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d postgres <<SQL\nCREATE\
    \ ROLE temporal LOGIN PASSWORD '${ANVILKIT_DEV_PASSWORD}';\nCREATE DATABASE temporal\
    \ OWNER temporal;\nCREATE DATABASE temporal_visibility OWNER temporal;\nSQL\n\
    for domain in control knowledge mcp; do\n  psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\"\
    \ -d postgres <<SQL\nCREATE ROLE anvilkit_${domain}_app LOGIN PASSWORD '${ANVILKIT_DEV_PASSWORD}';\n\
    CREATE ROLE anvilkit_${domain}_migrator LOGIN PASSWORD '${ANVILKIT_DEV_PASSWORD}';\n\
    CREATE DATABASE anvilkit_${domain} OWNER anvilkit_${domain}_migrator;\nSQL\n \
    \ # P14: the owner queue relay identity of the knowledge/mcp domains and\n  #\
    \ the Knowledge outbox forwarder identity (least privilege, granted by\n  # migration\
    \ 00002); Control has neither.\n  if [ \"$domain\" != control ]; then\n    psql\
    \ -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d postgres <<SQL\nCREATE ROLE anvilkit_${domain}_relay\
    \ LOGIN PASSWORD '${ANVILKIT_DEV_PASSWORD}';\nSQL\n  fi\n  if [ \"$domain\" =\
    \ knowledge ]; then\n    psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d postgres\
    \ <<SQL\nCREATE ROLE anvilkit_knowledge_forwarder LOGIN PASSWORD '${ANVILKIT_DEV_PASSWORD}';\n\
    SQL\n  fi\n  # The app role must not be able to create objects in the domain schema.\n\
    \  psql -v ON_ERROR_STOP=1 -U \"$POSTGRES_USER\" -d \"anvilkit_${domain}\" <<SQL\n\
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;\nALTER SCHEMA public OWNER TO anvilkit_${domain}_migrator;\n\
    SQL\ndone\n"
