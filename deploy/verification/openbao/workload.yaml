apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-verification
  labels:
    anvilkit.io/owner: repairs-f01-f12
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: anvilkit-agent-model-proxy
  namespace: anvilkit-verification
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: model-proxy-deepseek
  namespace: anvilkit-verification
spec:
  provider: openbao
  parameters:
    roleName: model-proxy-deepseek
    baoAddress: https://openbao.anvilkit-secrets.svc:8200
    baoCACertPath: /openbao/tls/ca.crt
    audience: openbao
    objects: |
      - objectName: deepseek-api-key
        secretPath: kv/data/anvilkit/local/model-proxy/deepseek
        secretKey: api_key
        filePermission: 0444
