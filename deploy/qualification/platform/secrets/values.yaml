# P0.6: some consumers read credentials only from a Kubernetes Secret (the
# Valkey and Temporal charts, Qdrant's API key, MinIO and its setup Job, the
# CNPG barman plugin's object store, the probes, the API's DEVELOPMENT_ONLY
# principals fixture). For each namespace one ServiceAccount, OpenBao role
# and KV v2 path, one SecretProviderClass whose secretObjects name exactly
# those Secrets, and a pause Pod that holds the CSI mount: the driver syncs
# the Secrets while the mount exists and refreshes them on rotation
# (rotationPollInterval). The Secrets carry the driver's
# secrets-store.csi.k8s.io/managed label; the material originates in OpenBao,
# where deploy/qualification/bootstrap.py writes it. Workloads that read files
# mount their own SecretProviderClass instead (the service charts).
openbao:
  address: https://openbao.anvilkit-platform.svc:8200
  caCertPath: /openbao/tls/ca.crt
  audience: openbao
# The cluster's own sandbox image (present on every node).
image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
syncs: []
#  - name: anvilkit-secrets-data          # ServiceAccount, OpenBao role, Deployment, class
#    namespace: anvilkit-data
#    path: kv/data/anvilkit/sync/data     # the KV v2 data path the role reads
#    secrets:
#      - name: anvilkit-valkey-queue
#        data: {password: valkey-password} # Secret key -> KV key
