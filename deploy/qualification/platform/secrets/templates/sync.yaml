{{- range .Values.syncs }}
{{- $sync := . }}
{{- $keys := list }}
{{- range .secrets }}{{ range $k, $v := .data }}{{ $keys = append $keys $v }}{{ end }}{{ end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  provider: openbao
  parameters:
    baoAddress: {{ $.Values.openbao.address | quote }}
    baoCACertPath: {{ $.Values.openbao.caCertPath | quote }}
    roleName: {{ .name | quote }}
    audience: {{ $.Values.openbao.audience | quote }}
    objects: |
      {{- range uniq $keys }}
      - objectName: {{ . | quote }}
        secretPath: {{ $sync.path | quote }}
        secretKey: {{ . | quote }}
        filePermission: 0400
      {{- end }}
  secretObjects:
    {{- range .secrets }}
    - secretName: {{ .name }}
      type: Opaque
      data:
        {{- range $k, $v := .data }}
        - {key: {{ $k | quote }}, objectName: {{ $v | quote }}}
        {{- end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels: {app.kubernetes.io/name: anvilkit-secrets, app.kubernetes.io/instance: {{ .name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: anvilkit-secrets, app.kubernetes.io/instance: {{ .name }}}
    spec:
      serviceAccountName: {{ .name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 65535, runAsGroup: 65535, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: hold
          image: {{ $.Values.image }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: 1m, memory: 4Mi}
            limits: {cpu: 10m, memory: 16Mi}
          volumeMounts:
            - {name: credentials, mountPath: /var/run/secrets/anvilkit/csi, readOnly: true}
      volumes:
        - name: credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .name }}
{{- end }}
