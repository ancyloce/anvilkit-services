image: natsio/nats-box:0.19.0@sha256:00f10dd4156f28ece84bb3a52cf356ef220ebaa0494310caa90dec184d9e2b89
natsUrl: tls://anvilkit-nats.anvilkit-data.svc.cluster.local:4222
# P0.6: the server's CA (the cert-manager Secret of the NATS server
# certificate, key ca.crt) and the provisioning NKey user's seed (permitted
# only the stream API of the ANVILKIT_* streams) from OpenBao through the CSI
# driver under the Job's own ServiceAccount and role. Empty tlsCASecret and
# csi.enabled false: the plaintext, anonymous NATS of a development foundation.
tlsCASecret: anvilkit-nats-tls
csi:
  enabled: true
  address: https://openbao.anvilkit-platform.svc:8200
  caCertPath: /openbao/tls/ca.crt
  audience: openbao
  path: kv/data/anvilkit/data/streams
replicas: 3
# The development foundation's stream definitions (deploy/dev/nats) with the
# environment's replica count.
streams: [knowledge, mcp, control]
