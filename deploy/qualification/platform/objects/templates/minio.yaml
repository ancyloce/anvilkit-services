apiVersion: v1
kind: Service
metadata:
  name: anvilkit-objects
spec:
  selector: {app.kubernetes.io/name: anvilkit-objects}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: anvilkit-objects
spec:
  serviceName: anvilkit-objects
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: anvilkit-objects}
  template:
    metadata:
      labels: {app.kubernetes.io/name: anvilkit-objects}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: {{ .Values.image }}
          args: ["server", "/data"{{ if .Values.tls.enabled }}, "--certs-dir", "/etc/minio/certs"{{ end }}]
          envFrom:
            - secretRef: {name: {{ .Values.rootSecret }}}
          ports: [{containerPort: 9000, name: s3}]
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3{{ if .Values.tls.enabled }}, scheme: HTTPS{{ end }}}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3{{ if .Values.tls.enabled }}, scheme: HTTPS{{ end }}}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            {{- if .Values.tls.enabled }}
            - {name: tls, mountPath: /etc/minio/certs, readOnly: true}
            {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            items:
              - {key: tls.crt, path: public.crt}
              - {key: tls.key, path: private.key}
              - {key: ca.crt, path: CAs/ca.crt}
      {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: {{ .Values.storageSize }}}}
