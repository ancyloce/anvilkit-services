# DEVELOPMENT_ONLY environment values of anvilkit-agent-model-proxy for the P23 qualification
# cluster (kind anvilkit-qualification: three control-plane and three worker
# nodes whose zone labels are simulated failure domains on one host). The
# chart is owned by the service repository; this file is the parent's
# environment combination. The image digest comes from the release manifest
# (tools/release-artifacts.py) through deploy/gitops; the credentials reach the
# Pods from OpenBao through the CSI driver (P0.6; bootstrap.py writes them
# there) and never enter Git. The replica, HPA,
# disruption, placement and pool limits are the ones deploy/gitops/lock.yaml
# declares for this environment (tools/check-deployment-lock.py).
image:
  repository: anvilkit-dev-registry:5000/anvilkit-agent-model-proxy
  pullPolicy: IfNotPresent
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-model-proxy
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-model-proxy
control:
  address: anvilkit-agent-control.anvilkit-apps.svc.cluster.local:9101
identity:
  trustDomain: anvilkit.qualification
  certificate:
    issuerRef:
      name: anvilkit-qualification-ca
  # P2.3: the listener authenticates its callers by the SPIFFE URI SAN of
  # their qualification certificates (no bearer principals); the Control
  # client stays mtls (the chart default).
  mode: mtls
config:
  identity:
    mtls:
      principals:
        - spiffe_id: spiffe://anvilkit.qualification/ns/anvilkit-apps/sa/anvilkit-agent-workflow
          principal_id: anvilkit-agent-workflow
          kind: workflow
        - spiffe_id: spiffe://anvilkit.qualification/ns/anvilkit-components/sa/anvilkit-job-access-sidecar
          principal_id: anvilkit-job-access-sidecar
          kind: sidecar
        - spiffe_id: spiffe://anvilkit.qualification/ns/anvilkit-apps/sa/anvilkit-agent-control
          principal_id: anvilkit-agent-control
          kind: control
secrets:
  provider: csi
  csi:
    address: https://openbao.anvilkit-platform.svc:8200
    caCertPath: /openbao/tls/ca.crt
    path: kv/data/anvilkit/apps/anvilkit-agent-model-proxy
trust:
  configMap: anvilkit-trust
store:
  s3:
    endpoint: https://anvilkit-objects.anvilkit-data.svc.cluster.local:9000
    bucket: anvilkit-model-proxy
# Telemetry (P23-06): spans to the node-local Collector (anvilkit-telemetry,
# internalTrafficPolicy Local); Prometheus scrapes the Pod's health port
# through the anvilkit-observability chart's PodMonitors (P3.6).
telemetry:
  otlpEndpoint: "http://anvilkit-otel-collector.anvilkit-observability.svc.cluster.local:4318"
# P0.1: the Control client presents the workload certificate the chart's
# Certificate (anvilkit-pki) issues. The listener runs identity.mode mtls
# (above, P2.3); the guard would admit the DEVELOPMENT_ONLY bearer principals
# only under identity.mode development, which this environment does not use.
development:
  enabled: true
