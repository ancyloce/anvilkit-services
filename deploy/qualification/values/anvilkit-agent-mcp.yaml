# DEVELOPMENT_ONLY environment values of anvilkit-agent-mcp for the P23 qualification
# cluster (kind anvilkit-qualification: three control-plane and three worker
# nodes whose zone labels are simulated failure domains on one host). The
# chart is owned by the service repository; this file is the parent's
# environment combination. The image digest comes from the release manifest
# (tools/release-artifacts.py) through deploy/gitops; Secrets are created by
# deploy/qualification/bootstrap.py and never enter Git. The replica, HPA,
# disruption, placement and pool limits are the ones deploy/gitops/lock.yaml
# declares for this environment (tools/check-deployment-lock.py).
image:
  repository: anvilkit-dev-registry:5000/anvilkit-agent-mcp
  pullPolicy: IfNotPresent
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-mcp
        app.kubernetes.io/component: mcp
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-mcp
        app.kubernetes.io/component: mcp
secrets:
  provider: csi
  csi:
    address: https://openbao.anvilkit-platform.svc:8200
    caCertPath: /openbao/tls/ca.crt
    path: kv/data/anvilkit/apps/anvilkit-agent-mcp
trust:
  configMap: anvilkit-trust
# P0.6: JetStream over TLS, verified against the CA of the workload identity
# bundle; the forwarder's and the relay's NKey seeds are CSI files.
nats:
  tls:
    mode: tls
    caSecret:
      name: anvilkit-agent-mcp-identity
      key: ca.crt
  url: tls://anvilkit-nats.anvilkit-data.svc.cluster.local:4222
control:
  address: anvilkit-agent-control.anvilkit-apps.svc.cluster.local:9101
relay:
  enabled: true
  image:
    repository: anvilkit-dev-registry:5000/anvilkit-agent-background-worker
# Telemetry (P23-06): spans to the node-local Collector (anvilkit-telemetry,
# internalTrafficPolicy Local), metrics scraped from the annotated Pod's health port.
podAnnotations:
  prometheus.io/scrape: "true"
telemetry:
  otlpTls:
    mode: development
  otlpEndpoint: "anvilkit-otel-collector.anvilkit-observability.svc.cluster.local:4317"
# P0.1: the workload identity issued by the qualification PKI (anvilkit-pki).
identity:
  trustDomain: anvilkit.qualification
  certificate:
    issuerRef:
      name: anvilkit-qualification-ca
# DEVELOPMENT_ONLY (P0.6): every data connection is TLS with verification and
# every credential comes from OpenBao; the guard still admits the
# development-labelled OTLP export (telemetry.otlpTls.mode development, B-36).
development:
  enabled: true
