# DEVELOPMENT_ONLY environment values of anvilkit-agent-api for the P23 qualification
# cluster (kind anvilkit-qualification: three control-plane and three worker
# nodes whose zone labels are simulated failure domains on one host). The
# chart is owned by the service repository; this file is the parent's
# environment combination. The image digest comes from the release manifest
# (tools/release-artifacts.py) through deploy/gitops; Secrets are created by
# deploy/qualification/bootstrap.py and never enter Git. The replica, HPA,
# disruption, placement and pool limits are the ones deploy/gitops/lock.yaml
# declares for this environment (tools/check-deployment-lock.py).
image:
  repository: anvilkit-dev-registry:5000/anvilkit-agent-api
  pullPolicy: IfNotPresent
replicaCount: 2
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-api
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: anvilkit-agent-api
control:
  address: anvilkit-agent-control.anvilkit-apps.svc.cluster.local:9101
auth:
  mode: fixture
  principalsSecret:
    name: anvilkit-agent-api-principals
# Telemetry (P23-06): spans to the node-local Collector (anvilkit-telemetry,
# internalTrafficPolicy Local), metrics scraped from the annotated Pod's metrics port.
podAnnotations:
  prometheus.io/scrape: "true"
telemetry:
  otlpTls:
    mode: development
  otlpEndpoint: "anvilkit-otel-collector.anvilkit-observability.svc.cluster.local:4317"
  metricsPort: 9464
# The owners behind API-07..16 (Knowledge and MCP gRPC Services of this environment).
knowledge:
  address: anvilkit-agent-knowledge.anvilkit-apps.svc.cluster.local:9105
mcp:
  address: anvilkit-agent-mcp.anvilkit-apps.svc.cluster.local:9106
# P0.1: the workload identity issued by the qualification PKI (anvilkit-pki).
identity:
  trustDomain: anvilkit.qualification
  certificate:
    issuerRef:
      name: anvilkit-qualification-ca
# The data plane of this environment is still plaintext (P0.6): each such
# connection names its development mode and the top-level guard admits it;
# the gRPC listener and clients stay mTLS.
development:
  enabled: true
