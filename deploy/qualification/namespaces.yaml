# The namespaces of the qualification cluster, applied by bootstrap.py before Argo CD
# (whose CreateNamespace then finds them in place).
#
# RB-S09: Pod Security Admission at the v1.36 standards, as on the development foundation
# and the Compose Jobs node. anvilkit-apps and anvilkit-parsing enforce restricted.
# anvilkit-components enforces baseline with its named exemption.
# deploy/policies/check.sh checks every workload placed in a labelled namespace against
# its level. anvilkit-data, anvilkit-platform and anvilkit-observability carry no Pod
# Security labels yet: their workloads are upstream charts and operator-created Pods,
# which no offline render covers.
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-apps
  labels:
    app.kubernetes.io/part-of: anvilkit
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-components
  labels:
    app.kubernetes.io/part-of: anvilkit
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    anvilkit.io/pod-security-exemption: "restricted is not met: the supervisor starts as UID 0 with SETUID, SETGID and SETPCAP to run the candidate under its own UID, and the local-check fixture runs as root; the anvilkit-components-pods ValidatingPolicy admits only the launcher's exact layouts (RB-S09)"
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-parsing
  labels:
    app.kubernetes.io/part-of: anvilkit
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-data
  labels:
    app.kubernetes.io/part-of: anvilkit
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-platform
  labels:
    app.kubernetes.io/part-of: anvilkit
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-observability
  labels:
    app.kubernetes.io/part-of: anvilkit
