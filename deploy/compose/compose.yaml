      ANVILKIT_KNOWLEDGE_QDRANT_URL: http://qdrant:6333
      ANVILKIT_KNOWLEDGE_QDRANT_API_KEY_FILE: /run/secrets/qdrant-api-key
      ANVILKIT_KNOWLEDGE_STORE_DATABASE_URL_FILE: /run/secrets/knowledge-store-dsn
      ANVILKIT_KNOWLEDGE_CLEANUP_DATABASE_URL_FILE: /run/secrets/knowledge-cleanup-dsn
    secrets: [knowledge-app-dsn, knowledge-objects-credentials, knowledge-removals-credentials, qdrant-api-key, knowledge-store-dsn, knowledge-cleanup-dsn, knowledge-launcher-kubeconfig]
    volumes:
      - ./config/anvilkit-agent-knowledge.yaml:/etc/anvilkit/anvilkit-agent-knowledge/config.yaml:ro
      - ${ANVILKIT_HOME:-/srv/anvilkit}/certs/anvilkit-agent-knowledge:/etc/anvilkit/identity:ro
      - ${ANVILKIT_HOME:-/srv/anvilkit}/certs/ca:/etc/anvilkit/inference-ca:ro
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
      anvilkit-agent-control: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9115/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy: { resources: { limits: { cpus: "2", memory: 1g } } }

  knowledge-forwarder:
