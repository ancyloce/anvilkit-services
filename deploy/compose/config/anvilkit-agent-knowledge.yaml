# Reviewed, secret-free configuration of anvilkit-agent-knowledge for the Compose placement
# (deploy/compose; DEVELOPMENT_ONLY). Rendered from the service chart's config
# template with development values (deploy/dev/values has no file for it) and adapted to the
# Compose service names; placements (addresses, listeners, secret files) come
# from the allowlisted ANVILKIT_* environment in compose.yaml. Mounted read-only
# at /etc/anvilkit/anvilkit-agent-knowledge/config.yaml.
apollo:
  app_id: anvilkit-agent-knowledge
  mode: disabled
control:
  identity:
    mode: mtls
    server_name: anvilkit-agent-control
  timeout: 5s
database:
  max_conn: 8
development:
  enabled: true
grpc:
  capacity: 64
  identity:
    ca_file: /etc/anvilkit/identity/ca.crt
    cert_file: /etc/anvilkit/identity/tls.crt
    key_file: /etc/anvilkit/identity/tls.key
    max_connection_age: 1h
    mode: mtls
    reload_interval: 5s
  listen: 127.0.0.1:9105
  shutdown_timeout: 20s
health:
  listen: 127.0.0.1:9115
inference:
  dimensions: 1024
  embedding_profile: bge-m3-v1
  embedding_revision: 5617a9f61b028005a4858fdac845db406aefb181
  max_batch: 32
  rerank_profile: bge-reranker-v2-m3-v1
  rerank_revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  timeout: 30s
  tls:
    ca_file: /etc/anvilkit/inference-ca/ca.crt
    mode: tls
objects:
  bucket: anvilkit-knowledge
  region: us-east-1
outbox:
  consumer_group: anvilkit-agent-knowledge-forwarder
parser:
  deadline_grace: 30s
  kube_timeout: 10s
  namespace: anvilkit-parsing
  # The single Jobs node carries one pool label (deploy/compose/jobs/rke2-config.yaml).
  node_pool: components
  poll_interval: 1s
  presign_ttl: 15m
  # Plan 0006 D-4: the development parser profile; parser-docling-v1 stays disabled.
  profile: parser-docling-dev-v1
  seccomp_profile: anvilkit/candidate.json
reload:
  drain_limit: 30s
  interval: 2s
retrieval:
  # Owner direction 2026-11-03 (step 3 of four): enable search on this placement.
  # The profile the integration tests use (tests/integration/*_integration_test.go);
  # without it every search answers PROFILE_UNQUALIFIED (src/application/retrieval.ts).
  # The other retrieval keys keep their built-in bounds (src/config.ts).
  profile_id: hybrid-bge-m3-dev-v1
sources:
  max_bytes: 33554432
tasks:
  max_attempts: 3
  max_input_bytes: 65536
  max_lease: 10m
  retry_delay: 5s
  sweep_interval: 2s
