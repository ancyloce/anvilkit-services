# Reviewed, secret-free configuration of anvilkit-agent-background-worker for the Compose placement
# (deploy/compose; DEVELOPMENT_ONLY). Rendered from the service chart's config
# template with the development values of deploy/dev/values and adapted to the
# Compose service names; placements (addresses, listeners, secret files) come
# from the allowlisted ANVILKIT_* environment in compose.yaml. Mounted read-only
# at /etc/anvilkit/anvilkit-agent-background-worker/config.yaml.
bull_board:
  enabled: false
  listen: 127.0.0.1:9128
  read_only: true
development:
  enabled: true
health:
  listen: 127.0.0.1:9127
identity:
  ca_file: /etc/anvilkit/identity/ca.crt
  cert_file: /etc/anvilkit/identity/tls.crt
  key_file: /etc/anvilkit/identity/tls.key
  mode: mtls
  reload_interval: 5s
owners:
  knowledge:
    server_name: anvilkit-agent-knowledge
  mcp:
    server_name: anvilkit-agent-mcp
queue:
  prefix: anvilkit
relay:
  ack_wait: 30s
  batch: 16
  max_deliver: 100
  reconcile_age: 5s
  reconcile_interval: 10s
  reconcile_limit: 500
  shutdown_timeout: 30s
worker:
  attempts: 3
  backoff: 5s
  concurrency: 4
  handler_timeout: 5m
  heartbeat_interval: 15s
  lease_seconds: 60
  lock_duration: 60s
  max_input_bytes: 65536
  max_stalled_count: 1
  owner_timeout: 10s
  shutdown_timeout: 30s
  stalled_interval: 30s
  submit_retries: 3
