# DEVELOPMENT_ONLY foundation for the replacement implementation (delivery.md P03).
# Isolated from the legacy anvilkit-local stack: its own project name, bridge
# network, loopback-only published ports and volumes. It is a reduced local
# topology, never HA evidence and never a production layout; production uses
# CloudNativePG clusters, a separately deployed Temporal (platform.md DD-10)
# and the qualified object backends of C09 (the MinIO below is the S3 API of
# the artifact store for P08 only; it is not RGW and qualifies no failure
# domain, placement or retention).
name: anvilkit-dev

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    env_file: ../../.local/dev/postgres.env
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-anvilkit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anvilkit_control"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  temporal-schema:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    env_file: ../../.local/dev/temporal.env
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
    entrypoint: ["/bin/sh", "/setup/temporal-setup.sh", "schemas"]
    volumes:
      - ./temporal-setup.sh:/setup/temporal-setup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  temporal:
    image: temporalio/server:1.31.2@sha256:6b02e5176631c8d28f010735a3a73c69423a9adbcfad7e5dfe23836c904b7e26
    restart: unless-stopped
    env_file: ../../.local/dev/temporal.env
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_BROADCAST_ADDRESS: 127.0.0.1
      NUM_HISTORY_SHARDS: "4"
    ports:
      - "127.0.0.1:27233:7233"
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 2s
      timeout: 3s
      retries: 40

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2@sha256:dbc5fcd6ee8f0f4d808bf765af9a87dea9d8a283abfdcfbd2fc148496ba66107
    entrypoint: ["/bin/sh", "/setup/temporal-setup.sh", "namespace"]
    volumes:
      - ./temporal-setup.sh:/setup/temporal-setup.sh:ro
    depends_on:
      temporal:
        condition: service_healthy

  # The object stores: one S3-compatible API with the versioned artifact
  # bucket of P08 (anvilkit-artifacts, the foundation's root credentials in
  # .local/dev/minio.env) and the shared inventory bucket of the Control
  # replicas in the kind cluster (anvilkit-inventory, its own user and policy
  # in .local/dev/minio-inventory.env), on its own volume. Host-side runs keep
  # the filesystem inventory; either way the two permission boundaries are
  # separate credentials.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ["server", "/data"]
    env_file: ../../.local/dev/minio.env
    ports:
      - "127.0.0.1:29000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s

  minio-setup:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    env_file:
      - ../../.local/dev/minio.env
      - ../../.local/dev/minio-inventory.env
    entrypoint: ["/bin/sh", "/setup/minio-setup.sh"]
    volumes:
      - ./minio-setup.sh:/setup/minio-setup.sh:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
