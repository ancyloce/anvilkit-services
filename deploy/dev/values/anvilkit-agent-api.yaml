# DEVELOPMENT_ONLY environment values of anvilkit-agent-api for the kind cluster
# of the development foundation. The chart itself is owned by the API
# repository (services/agent/api/deploy/chart); this file is the parent's
# environment combination for it. Secrets stay out of Git: the principals
# Secret is created by deploy/dev/api-chart.sh from .local/dev/api-principals.json.
# control.address (the host-side Control reached from inside kind through the
# Docker network gateway) is machine-specific and is set by the script.
replicaCount: 1
image:
  repository: anvilkit-agent-api
  tag: dev
  # A locally built image is loaded into the kind node by name; a registry-served
  # image is pinned here by digest instead (image.digest).
  pullPolicy: Never
auth:
  mode: fixture
  principalsSecret:
    name: anvilkit-agent-api-principals
    key: principals.json
# P0.1: the API's gRPC clients present a certificate issued by the development
# PKI (deploy/dev/k8s/pki.yaml) and verify the owners by their service names.
identity:
  mode: mtls
  trustDomain: anvilkit.local
  certificate:
    create: true
    issuerRef:
      name: anvilkit-dev-ca
      kind: ClusterIssuer
      group: cert-manager.io
control:
  serverName: anvilkit-agent-control
knowledge:
  serverName: anvilkit-agent-knowledge
mcp:
  serverName: anvilkit-agent-mcp
# The foundation's OTLP collector (when placed) is plaintext, which only the
# top-level DEVELOPMENT_ONLY guard admits; it downgrades no gRPC client.
development:
  enabled: true
podDisruptionBudget:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
