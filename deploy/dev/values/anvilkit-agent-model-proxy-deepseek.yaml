# DEVELOPMENT_ONLY overlay for deploy/dev/model-proxy-chart.sh (a second
# values file): the one real route of the API-driven generation smoke, named
# as the team image's baked team.yaml and the Workflow's preparation route
# name it (controlled-openai-v1), bound at USD 1 per send (scale-6 "1000000",
# the team's exposurePerSend), carrying the analysis tools of the Workflow's
# Preparation (read_brief, submit_requirements, ask_questions) and the team's
# reviewed tools (jobs/codegen/team/agent/team/tools.json), with the provider
# credential from the Secret anvilkit-agent-model-proxy-deepseek (created
# from the owner's key, never in Git). Generated 2026-10-22; regenerate when
# tools.json or the analysis tools change. The listener runs mTLS (the
# worker and the Job sidecar present their workload certificates; the
# plaintext development identity cannot serve them) with the three in-cluster
# principals.
identity:
  mode: mtls
config:
  identity:
    mtls:
      principals:
      - spiffe_id: spiffe://anvilkit.local/ns/anvilkit-apps/sa/anvilkit-agent-workflow
        principal_id: anvilkit-agent-workflow
        kind: workflow
      - spiffe_id: spiffe://anvilkit.local/ns/anvilkit-components/sa/anvilkit-job-access-sidecar
        principal_id: anvilkit-job-access-sidecar
        kind: sidecar
      - spiffe_id: spiffe://anvilkit.local/ns/anvilkit-apps/sa/anvilkit-agent-control
        principal_id: anvilkit-agent-control
        kind: control
  routes:
  - id: controlled-openai-v1
    enabled: true
    api: openai-completions
    provider: deepseek
    model: deepseek-flash
    base_url: https://api.deepseek.com
    credential_env: ANVILKIT_MODEL_PROXY_CREDENTIAL_DEEPSEEK
    limits:
      max_output_tokens: 4096
      max_exposure:
        currency: USD
        amount: '1000000'
      max_deadline: 1h
      max_frame_bytes: 65536
      max_output_bytes: 1048576
      max_frames: 4096
      upstream_timeout: 4m
      max_evidence_bytes: 4194304
    tools:
    - name: read_brief
      description: Reads the frozen brief.
      input_schema:
        type: object
        additionalProperties: false
        properties:
          section:
            type: string
            maxLength: 64
    - name: submit_requirements
      description: Submits the structured requirements of the requested component.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - componentName
        - packageName
        - purpose
        - content
        - interaction
        - editableFields
        - constraints
        - acceptance
        - unknowns
        properties:
          componentName:
            type: string
            pattern: ^[A-Z][A-Za-z0-9]{0,63}$
          packageName:
            type: string
            pattern: ^(@[a-z0-9-]+/)?[a-z0-9][a-z0-9._-]{0,212}$
          purpose:
            type: string
            minLength: 1
            maxLength: 2000
          content:
            type: string
            minLength: 1
            maxLength: 8000
          interaction:
            type: string
            maxLength: 4000
          editableFields:
            type: array
            maxItems: 32
            items:
              type: object
              additionalProperties: false
              required:
              - name
              - type
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                type:
                  type: string
                  enum:
                  - text
                  - richtext
                  - image
                  - link
                  - number
                  - boolean
                  - color
                default:
                  type: string
                  maxLength: 2000
          constraints:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 1000
          acceptance:
            type: array
            maxItems: 32
            items:
              type: string
              maxLength: 1000
          unknowns:
            type: array
            maxItems: 16
            items:
              type: string
              maxLength: 1000
    - name: ask_questions
      description: Asks at most three grouped clarification questions when the request is insufficient.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - questions
        properties:
          questions:
            type: array
            minItems: 1
            maxItems: 3
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - text
              properties:
                id:
                  type: string
                  pattern: ^q[1-9]$
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
    - name: submit_plan
      description: Submits the finite structured plan of the component (the Planner's only output).
      input_schema:
        type: object
        additionalProperties: false
        required:
        - componentId
        - puckType
        - packageName
        - version
        - steps
        properties:
          componentId:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          puckType:
            type: string
            pattern: ^[A-Z][A-Za-z0-9]{0,63}$
          packageName:
            type: string
            maxLength: 214
          version:
            type: string
            pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
          steps:
            type: array
            minItems: 1
            maxItems: 12
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - title
              - files
              - detail
              properties:
                id:
                  type: string
                  pattern: ^[a-z0-9-]{1,32}$
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                files:
                  type: array
                  maxItems: 32
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
                detail:
                  type: string
                  minLength: 1
                  maxLength: 4000
    - name: submit_findings
      description: Submits review findings with severities, file references and remediations, and the review verdict.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - verdict
        - findings
        properties:
          verdict:
            enum:
            - pass
            - repair
          findings:
            type: array
            maxItems: 64
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - severity
              - file
              - summary
              - remediation
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9-]{1,32}$
                severity:
                  enum:
                  - blocker
                  - major
                  - minor
                file:
                  type: string
                  minLength: 1
                  maxLength: 512
                line:
                  type: integer
                  minimum: 1
                summary:
                  type: string
                  minLength: 1
                  maxLength: 1000
                remediation:
                  type: string
                  minLength: 1
                  maxLength: 2000
    - name: submit_retrieval
      description: Submits the answer to a retrieval question with the ids of the returned evidence it cites.
      input_schema:
        type: object
        additionalProperties: false
        required:
        - answer
        - citations
        properties:
          answer:
            type: string
            minLength: 1
            maxLength: 8000
          citations:
            type: array
            maxItems: 32
            items:
              type: string
              minLength: 1
              maxLength: 128
    - name: read
      description: Read the contents of a file. Supports text files and images (jpg, png, gif, webp, bmp). Images are sent as attachments. For text files, output is truncated to 2000 lines or 50KB (whichever is hit first). Use offset/limit for large files. When you need the full file, continue with offset until complete.
      input_schema:
        type: object
        required:
        - path
        properties:
          path:
            type: string
            description: Path to the file to read (relative or absolute)
          offset:
            type: number
            description: Line number to start reading from (1-indexed)
          limit:
            type: number
            description: Maximum number of lines to read
    - name: write
      description: Write content to a file. Creates the file if it doesn't exist, overwrites if it does. Automatically creates parent directories.
      input_schema:
        type: object
        required:
        - path
        - content
        properties:
          path:
            type: string
            description: Path to the file to write (relative or absolute)
          content:
            type: string
            description: Content to write to the file
    - name: edit
      description: Edit a single file using exact text replacement. Every edits[].oldText must match a unique, non-overlapping region of the original file. If two changes affect the same block or nearby lines, merge them into one edit instead of emitting overlapping edits. Do not include large unchanged regions just to connect distant changes.
      input_schema:
        type: object
        required:
        - path
        - edits
        properties:
          path:
            type: string
            description: Path to the file to edit (relative or absolute)
          edits:
            type: array
            items:
              type: object
              required:
              - oldText
              - newText
              properties:
                oldText:
                  type: string
                  description: Exact text for one targeted replacement. It must be unique in the original file and must not overlap with any other edits[].oldText in the same call.
                newText:
                  type: string
                  description: Replacement text for this targeted edit.
            description: One or more targeted replacements. Each edit is matched against the original file, not incrementally. Do not include overlapping or nested edits. If two changes touch the same block or nearby lines, merge them into one edit instead.
    - name: ls
      description: List directory contents. Returns entries sorted alphabetically, with '/' suffix for directories. Includes dotfiles. Output is truncated to 500 entries or 50KB (whichever is hit first).
      input_schema:
        type: object
        properties:
          path:
            type: string
            description: 'Directory to list (default: current directory)'
          limit:
            type: number
            description: 'Maximum number of entries to return (default: 500)'
    - name: grep
      description: Search file contents for a pattern. Returns matching lines with file paths and line numbers. Respects .gitignore. Output is truncated to 100 matches or 50KB (whichever is hit first). Long lines are truncated to 500 chars.
      input_schema:
        type: object
        required:
        - pattern
        properties:
          pattern:
            type: string
            description: Search pattern (regex or literal string)
          path:
            type: string
            description: 'Directory or file to search (default: current directory)'
          glob:
            type: string
            description: Filter files by glob pattern, e.g. '*.ts' or '**/*.spec.ts'
          ignoreCase:
            type: boolean
            description: 'Case-insensitive search (default: false)'
          literal:
            type: boolean
            description: 'Treat pattern as literal string instead of regex (default: false)'
          context:
            type: number
            description: 'Number of lines to show before and after each match (default: 0)'
          limit:
            type: number
            description: 'Maximum number of matches to return (default: 100)'
    - name: find
      description: Search for files by glob pattern. Returns matching file paths relative to the search directory. Respects .gitignore. Output is truncated to 1000 results or 50KB (whichever is hit first).
      input_schema:
        type: object
        required:
        - pattern
        properties:
          pattern:
            type: string
            description: Glob pattern to match files, e.g. '*.ts', '**/*.json', or 'src/**/*.spec.ts'
          path:
            type: string
            description: 'Directory to search in (default: current directory)'
          limit:
            type: number
            description: 'Maximum number of results (default: 1000)'
routeCredentials:
- env: ANVILKIT_MODEL_PROXY_CREDENTIAL_DEEPSEEK
  secret:
    name: anvilkit-agent-model-proxy-deepseek
    key: credential
