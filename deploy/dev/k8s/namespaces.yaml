# The namespaces of the development foundation (platform-owned, DD-10 §1):
# anvilkit-components runs the launched Jobs under the Job-admission policies
# (deploy/policies/chart) and the components node pool; anvilkit-apps hosts
# the service releases installed by deploy/dev/*-chart.sh. Identities and
# RBAC belong to the charts that need them (the Workflow chart owns the
# launcher's).
#
# RB-S09: Pod Security Admission, pinned to the v1.36 standards (the Jobs node
# runs v1.36, qualification v1.37). anvilkit-apps and anvilkit-parsing enforce
# restricted. anvilkit-components enforces baseline, audits restricted, and
# names its exemption; its Kyverno policies are the stricter rule set there.
# deploy/policies/check.sh checks every workload placed here against the level.
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-components
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: v1.36
  annotations:
    anvilkit.io/pod-security-exemption: "restricted is not met: the supervisor starts as UID 0 with SETUID, SETGID and SETPCAP to run the candidate under its own UID, and the local-check fixture runs as root; the anvilkit-components-pods ValidatingPolicy admits only the launcher's exact layouts (RB-S09)"
---
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-apps
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# anvilkit-parsing runs the Knowledge launcher's Docling parser Jobs (P15)
# under the parser policies (deploy/policies/chart/templates/parsing-jobs.yaml and the registry allowlist);
# the launcher's Role belongs to the Knowledge chart.
apiVersion: v1
kind: Namespace
metadata:
  name: anvilkit-parsing
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
